<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LLM Debug — Live Gemma I/O</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --fg: #c9d1d9;
      --muted: #8b949e;
      --prompt: #79c0ff;
      --token: #a5d6ff;
      --error: #ff7b72;
      --done: #7ee787;
      --status-ok: #3fb950;
      --status-bad: #f85149;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--status-bad); }
    .status.connected .dot { background: var(--status-ok); }
    .controls { display: flex; gap: 8px; }
    button {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }
    button:hover { background: #30363d; }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      height: calc(100vh - 41px);
    }
    .pane {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }
    .pane h2 {
      margin: 0;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .log {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }
    .entry { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
    .entry:last-child { border-bottom: none; }
    .entry .ts { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .entry .meta { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .entry .body { color: var(--fg); }
    .response.streaming::after {
      content: '▍';
      color: var(--token);
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }
    .error { color: var(--error); }
    .done { color: var(--done); font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>LLM Debug — Live Gemma I/O</h1>
    <div class="controls">
      <span id="status" class="status"><span class="dot"></span><span class="label">disconnected</span></span>
      <button id="clear">Clear</button>
      <button id="autoscroll-toggle">Autoscroll: on</button>
    </div>
  </header>
  <main>
    <section class="pane">
      <h2>Prompts → Gemma</h2>
      <div id="prompts" class="log"></div>
    </section>
    <section class="pane">
      <h2>Gemma → Response (streamed)</h2>
      <div id="responses" class="log"></div>
    </section>
  </main>
  <script src="/static/llm_debug.js"></script>
</body>
</html>
